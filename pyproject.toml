[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioant-verify"
version = "0.1.0"
description = "Exact-revision external acceptance runner for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
ioant-verify = "runner.main:main"

[tool.setuptools.packages.find]
include = ["runner*", "adapters*", "schemas*", "config*"]

[tool.setuptools.package-data]
schemas = ["*.json"]
config = ["*.json", "*.yaml"]
"adapters.demo.suites" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
